<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IT Helpdesk Dashboard</title><link rel="stylesheet" href="/static/css/style.css"></head><body><main class="container"><header class="hero"><div><p class="eyebrow">Support dashboard</p><h1>IT Helpdesk</h1><p>Create, search, filter, and resolve employee support tickets.</p></div><a class="button" href="/tickets/new">+ Create Ticket</a></header><section class="cards"><article><span>Total Tickets</span><strong id="total">0</strong></article><article><span>Open</span><strong id="open">0</strong></article><article><span>In Progress</span><strong id="inProgress">0</strong></article><article><span>Resolved</span><strong id="resolved">0</strong></article><article><span>High/Critical</span><strong id="highCritical">0</strong></article></section><section class="panel"><div class="toolbar"><input id="search" placeholder="Search ID, employee, or email"><select id="status"><option value="">All statuses</option><option>Open</option><option>In Progress</option><option>Resolved</option></select><select id="priority"><option value="">All priorities</option><option>Low</option><option>Medium</option><option>High</option><option>Critical</option></select><select id="category"><option value="">All categories</option><option>Hardware</option><option>Software</option><option>Network</option><option>Account</option><option>Other</option></select></div><div id="message" class="message"></div><table><thead><tr><th>ID</th><th>Employee</th><th>Category</th><th>Priority</th><th>Status</th><th>Created</th></tr></thead><tbody id="ticketsTable"></tbody></table></section></main><script src="/static/js/app.js"></script></body></html>
