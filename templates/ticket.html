<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ticket Details</title><link rel="stylesheet" href="/static/css/style.css"></head><body><main class="container narrow"><a href="/">← Dashboard</a><section class="panel"><h1 id="ticketTitle">Ticket</h1><dl id="ticketDetails" class="details"></dl><form id="updateForm" data-ticket-id="{{ ticket_id }}"><label>Status<select name="status"><option>Open</option><option>In Progress</option><option>Resolved</option></select></label><label>Priority<select name="priority"><option>Low</option><option>Medium</option><option>High</option><option>Critical</option></select></label><label>Resolution<textarea name="resolution"></textarea></label><button class="button" type="submit">Update Ticket</button></form><div id="message" class="message"></div></section></main><script src="/static/js/app.js"></script></body></html>
