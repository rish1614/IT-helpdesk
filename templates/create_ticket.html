<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create Ticket</title><link rel="stylesheet" href="/static/css/style.css"></head><body><main class="container narrow"><a href="/">← Dashboard</a><section class="panel"><h1>Create Ticket</h1><form id="ticketForm"><label>Name<input name="name" required minlength="2"></label><label>Email<input name="email" type="email" required></label><label>Category<select name="category" required><option>Hardware</option><option>Software</option><option>Network</option><option>Account</option><option>Other</option></select></label><label>Priority<select name="priority" required><option>Low</option><option>Medium</option><option>High</option><option>Critical</option></select></label><label>Description<textarea name="description" required minlength="10"></textarea></label><button class="button" type="submit">Submit Ticket</button></form><div id="message" class="message"></div></section></main><script src="/static/js/app.js"></script></body></html>
